<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 88">
  <defs>
    <linearGradient id="wh" x1="0" y1="0" x2="96" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#c77dff"/>
    </linearGradient>
  </defs>

  <!-- Row 1: 3 package boxes -->
  <rect x="0"  y="0" width="28" height="40" rx="3" fill="url(#wh)"/>
  <rect x="32" y="0" width="28" height="40" rx="3" fill="url(#wh)"/>
  <rect x="64" y="0" width="28" height="40" rx="3" fill="url(#wh)"/>
  <!-- Tape seams row 1 -->
  <rect x="0"  y="15" width="28" height="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="32" y="15" width="28" height="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="64" y="15" width="28" height="2" fill="rgba(255,255,255,0.3)"/>

  <!-- Row 2: side boxes -->
  <rect x="0"  y="44" width="28" height="44" rx="3" fill="url(#wh)"/>
  <rect x="64" y="44" width="28" height="44" rx="3" fill="url(#wh)"/>
  <!-- Tape seams row 2 -->
  <rect x="0"  y="61" width="28" height="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="64" y="61" width="28" height="2" fill="rgba(255,255,255,0.3)"/>

  <!-- Loading dock (center bottom) -->
  <rect x="32" y="44" width="28" height="44" rx="3" fill="url(#wh)" opacity="0.65"/>
  <!-- Arched bay door opening -->
  <path d="M 38,88 L 38,65 A 8,8 0 0 0 54,65 L 54,88 Z" fill="#0d1117"/>
</svg>
