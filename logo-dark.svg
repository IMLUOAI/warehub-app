<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" width="460" height="160">
  <rect width="460" height="160" fill="#0d1117"/>

  <defs>
    <!-- gradient anchored to the D mark's bounding box in userSpace -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="22" y1="18" x2="84" y2="142">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#c77dff"/>
    </linearGradient>
  </defs>

  <!-- D mark: stem + arc, gradient stroke -->
  <line x1="22" y1="18" x2="22" y2="142"
        stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 22,18 A 62,62 0 0,1 22,142"
        fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
  <!-- Warehouse door -->
  <rect x="44" y="104" width="14" height="28" rx="2" fill="url(#g)"/>

  <!-- Wordmark -->
  <text
    x="130" y="87"
    font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
    font-size="56"
    font-weight="900"
    fill="#e2e8f0"
    letter-spacing="-2">WAREHUB</text>

  <rect x="130" y="99" width="318" height="1" fill="#1e2a3a"/>

  <text
    x="132" y="118"
    font-family="Arial,Helvetica,sans-serif"
    font-size="11"
    fill="#4a9eff"
    letter-spacing="5">WAREHOUSE MANAGEMENT</text>

  <text
    x="132" y="138"
    font-family="Arial,Helvetica,sans-serif"
    font-size="10"
    fill="#4a6080"
    letter-spacing="2">
    <tspan font-weight="700" fill="url(#g)">D</tspan>OUBLE SIDED ISCM LLC
  </text>
</svg>
