<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" width="460" height="160">
  <rect width="460" height="160" fill="white"/>

  <!-- D mark: two strokes — stem + arc — eye completes the letter -->
  <line x1="22" y1="18" x2="22" y2="142"
        stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <path d="M 22,18 A 62,62 0 0,1 22,142"
        fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <!-- Warehouse: single door rect in the bowl -->
  <rect x="44" y="104" width="14" height="28" rx="2" fill="#111"/>

  <!-- Wordmark -->
  <text
    x="130" y="87"
    font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
    font-size="56"
    font-weight="900"
    fill="#111"
    letter-spacing="-2">WAREHUB</text>

  <rect x="130" y="99" width="318" height="1.2" fill="#ddd"/>

  <text
    x="132" y="118"
    font-family="Arial,Helvetica,sans-serif"
    font-size="11"
    fill="#aaa"
    letter-spacing="5.5">WAREHOUSE MANAGEMENT</text>

  <text
    x="132" y="138"
    font-family="Arial,Helvetica,sans-serif"
    font-size="10"
    fill="#ccc"
    letter-spacing="2">
    <tspan font-weight="700" fill="#888">D</tspan>OUBLE SIDED ISCM LLC
  </text>
</svg>
